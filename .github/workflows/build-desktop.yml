name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*-macos"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          brew install ffmpeg
          chmod +x mac/build_mac.sh
      - name: Build macOS app
        run: ./mac/build_mac.sh
      - name: Zip macOS app
        run: ditto -c -k --sequesterRsrc --keepParent dist/ValorantHighlightClipper.app dist/ValorantHighlightClipper-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ValorantHighlightClipper-macOS
          path: dist/ValorantHighlightClipper-macOS.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Valorant Highlight Clipper macOS ${{ github.ref_name }}
          files: dist/ValorantHighlightClipper-macOS.zip
          generate_release_notes: true
          body: |
            macOS native AppKit build for Valorant Highlight Clipper.

            Download `ValorantHighlightClipper-macOS.zip`, unzip it, then open `ValorantHighlightClipper.app`.

            If macOS blocks the app on first launch, right-click the app and choose Open.
